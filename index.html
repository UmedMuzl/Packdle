<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packdle - DK64 Song Guessing Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">PACKDLE</h1>
            <p class="subtitle">Guess the DK64-Converted Song!</p>
        </div>

        <div class="modes-grid">
            <a href="game.html?mode=daily" class="mode-card">
                <span class="mode-icon">📅</span>
                <h2>Daily Challenge</h2>
                <p>One puzzle per day</p>
            </a>

            <a href="game.html?mode=random" class="mode-card">
                <span class="mode-icon">🎲</span>
                <h2>Random Game</h2>
                <p>Play as many as you want</p>
            </a>
        </div>

        <div class="footer">
            <p>Songs from the <a href="https://github.com/theballaam96/candys-shop" target="_blank">Candy's Shop</a> DK64 music library</p>
        </div>
    </div>
</body>
</html>
